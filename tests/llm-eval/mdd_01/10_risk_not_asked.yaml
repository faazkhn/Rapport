type: risk_not_asked
variant: female
start_state: {trust: 50, engagement: 45}
note: Warm interview that never asks about suicide. Passive SI must never surface unprompted (it is must_be_asked).
expect: {must_not_reveal: [f_passive_si, f_no_plan_no_attempt, f_no_means], no_si_words: true}
turns:
  - Hello again. How have you been since we last met?
