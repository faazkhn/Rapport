- Has anyone in your family had problems with their nerves?
- Any medical problems, or medicines you take?
- Sometimes people who feel this low think life isn't worth living. Have you had thoughts like that?
- Have you made any plans?
- What keeps you going?
- What do you think would help you most right now?
- Is there anything you'd like to ask me?
