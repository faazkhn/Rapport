turns:
- Hello, I'm Dr. Faaz. What brings you in today?
- How long has this been going on?
- What was happening around the time it started?
- How has your mood been?
- That sounds really hard.
- How's your sleep?
- And your appetite?
- How is your energy during the day?
- How is your concentration at work?
- Tell me about your manager.
- How are things at home with your flatmate?
- How often do you talk to your family?
- What do you do to relax?
- Do you still sing?
- How do you feel about yourself these days?
- Do you drink alcohol or use anything else?
- Have you ever heard voices or seen things others can't?
